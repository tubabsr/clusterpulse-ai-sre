apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-ai-rca-config
  namespace: observability
data:
  CLUSTER_NAME: "on-prem-prod"
  ENVIRONMENT: "production"
  AI_ENABLED: "true"
  AI_PROVIDER: "openai_compatible"
  AI_BASE_URL: "https://api.openai.com/v1"
  AI_MODEL: "gpt-4.1-mini"
  PROMETHEUS_URL: "http://kps-kube-prometheus-prometheus.monitoring.svc:9090"
  MONITOR_EXCLUDED_NAMESPACES: "kube-system,kube-public,kube-node-lease"
  RESTART_THRESHOLD: "3"
  PENDING_MINUTES: "5"
  LOG_TAIL_LINES: "120"
---
# Replace placeholders before applying. Prefer External Secrets or your enterprise vault.
apiVersion: v1
kind: Secret
metadata:
  name: k8s-ai-rca-secrets
  namespace: observability
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://rca:CHANGE_ME@postgres:5432/rca"
  AI_API_KEY: "CHANGE_ME"
  GRAPH_TENANT_ID: "CHANGE_ME"
  GRAPH_CLIENT_ID: "CHANGE_ME"
  GRAPH_CLIENT_SECRET: "CHANGE_ME"
  GRAPH_SENDER: "rca-agent@company.example"
  EMAIL_RECIPIENTS: "platform-oncall@company.example"
