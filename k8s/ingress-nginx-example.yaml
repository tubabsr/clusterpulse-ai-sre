apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-ai-rca-agent
  namespace: observability
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - clusterpulse.example.internal
    secretName: clusterpulse-tls
  rules:
  - host: clusterpulse.example.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: k8s-ai-rca-agent
            port:
              number: 8080
