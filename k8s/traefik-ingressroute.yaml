# Replace hostname and TLS secret name for your environment.
# Requires Traefik CRDs and entryPoints named "web" and "websecure".
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clusterpulse-http-redirect
  namespace: clusterpulse
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`clusterpulse.local`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: clusterpulse-https-redirect
      services:
        - name: k8s-ai-rca-agent
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clusterpulse-https
  namespace: clusterpulse
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`clusterpulse.local`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: clusterpulse-basic-auth
      services:
        - name: k8s-ai-rca-agent
          port: 8080
  tls:
    secretName: clusterpulse-tls
