apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-ai-rca-agent
  namespace: clusterpulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-ai-rca-agent-clusterpulse
rules:
- apiGroups: [""]
  # configmaps/serviceaccounts feed the topology graph. ConfigMap *contents* are never returned (key count only).
  # Secrets are deliberately NOT granted. Remove "configmaps" and set TOPOLOGY_INCLUDE_CONFIGMAPS=false to opt out.
  resources: ["pods", "pods/log", "events", "nodes", "namespaces", "services", "endpoints", "persistentvolumeclaims", "configmaps", "serviceaccounts"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["traefik.io", "traefik.containo.us"]
  resources: ["ingressroutes", "middlewares"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["source.toolkit.fluxcd.io"]
  resources: ["gitrepositories"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kustomize.toolkit.fluxcd.io"]
  resources: ["kustomizations"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources: ["helmreleases"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-ai-rca-agent-clusterpulse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-ai-rca-agent-clusterpulse
subjects:
- kind: ServiceAccount
  name: k8s-ai-rca-agent
  namespace: clusterpulse
