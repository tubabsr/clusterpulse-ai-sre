apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-ai-rca-config
  namespace: clusterpulse
data:
  CLUSTER_NAME: "on-prem-prod"
  ENVIRONMENT: "production"
  AI_ENABLED: "true"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_STARTTLS: "true"
  SMTP_USE_SSL: "false"
  SMTP_FROM: "clusterpulse@example.internal"
  EMAIL_RECIPIENTS: "platform-oncall@example.internal"
  EMAIL_CC: ""
  AI_PROVIDER: "openai_compatible"
  AI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
  AI_MODEL: "gemini-3.5-flash-lite"
  PROMETHEUS_URL: "http://cluster-monitoring-kube-pr-prometheus.monitoring.svc:9090"
  MONITOR_EXCLUDED_NAMESPACES: "kube-system,kube-public,kube-node-lease"
  RESTART_THRESHOLD: "3"
  PENDING_MINUTES: "5"
  LOG_TAIL_LINES: "120"
  TOPOLOGY_INCLUDE_CONFIGMAPS: "true"
  TOPOLOGY_CACHE_SECONDS: "5"
